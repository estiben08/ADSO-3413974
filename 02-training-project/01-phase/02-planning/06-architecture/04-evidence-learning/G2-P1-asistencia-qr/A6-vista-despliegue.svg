<text x="215" y="139" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle"><<device>> Nodo 1: PC Aula Instructor</text>
<text x="60" y="166" font-size="11" fill="#1e293b">SO: Windows 11 / Navegador Web</text>
<text x="60" y="183" font-size="11" fill="#1e293b">Red: Subred Aula 192.168.10.0/24</text>
<text x="60" y="200" font-size="11" fill="#1e293b">Artefactos alojados:</text>
<text x="60" y="217" font-size="11" fill="#1e293b">  • dashboard-monitoreo.html</text>
<text x="60" y="234" font-size="11" fill="#1e293b">  • ui-proyeccion-qr.js (Rotación 30 s)</text>
