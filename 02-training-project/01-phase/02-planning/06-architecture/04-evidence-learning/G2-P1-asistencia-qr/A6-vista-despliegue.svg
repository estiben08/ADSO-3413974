<text x="215" y="479" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle"><<device>> Nodo 2: Smartphone Aprendiz</text>
<text x="60" y="506" font-size="11" fill="#1e293b">SO: Android / iOS · Navegador Móvil</text>
<text x="60" y="523" font-size="11" fill="#1e293b">Red: WiFi Aula 192.168.10.0/24 (x35)</text>
<text x="60" y="540" font-size="11" fill="#1e293b">Artefactos alojados:</text>
<text x="60" y="557" font-size="11" fill="#1e293b">  • ui-escaneo-movil.html (Mobile-First)</text>
<text x="60" y="574" font-size="11" fill="#1e293b">  • scanner-qr.js (< 50 KB, sin APK)</text>
<text x="60" y="591" font-size="11" fill="#1e293b">RNF-03: Responsivo >= 360px + Cámara HTTPS</text>
<rect x="520" y="160" width="370" height="490" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<rect x="520" y="160" width="370" height="28" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="705" y="179" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle"><<server>> Nodo 3: Servidor de Aplicación</text>
<text x="530" y="206" font-size="11" fill="#1e293b">SO: Linux Ubuntu 24.04 LTS (Docker Host)</text>
<text x="530" y="223" font-size="11" fill="#1e293b">──────────────────────────────────────</text>
<text x="530" y="240" font-size="11" fill="#1e293b">1. <<executionEnvironment>> Nginx 1.26 Proxy</text>
<text x="530" y="257" font-size="11" fill="#1e293b">   • Terminación SSL/TLS 1.3 (Puerto 443)</text>
<text x="530" y="274" font-size="11" fill="#1e293b">   • Cabecera X-Real-IP de subred aula</text>
<text x="530" y="291" font-size="11" fill="#1e293b">   • Conexión interna: HTTP/WSGI TCP 8000</text>
<text x="530" y="308" font-size="11" fill="#1e293b">──────────────────────────────────────</text>
<text x="530" y="325" font-size="11" fill="#1e293b">2. <<executionEnvironment>> Gunicorn + Python 3.12</text>
<text x="530" y="342" font-size="11" fill="#1e293b">   • 4 Workers concurrentes pre-cargados</text>
<text x="530" y="359" font-size="11" fill="#1e293b">   • Artefacto: asistencia-qr-app.whl</text>
<text x="530" y="376" font-size="11" fill="#1e293b">   • Aloja los 7 Componentes de Software (A5)</text>
<text x="530" y="393" font-size="11" fill="#1e293b">   • MySQLConnectionPool (20 conexiones)</text>
<text x="530" y="410" font-size="11" fill="#1e293b">RNF-01: Respuesta p95 <= 1,5 s (35 usuarios)</text>
<text x="530" y="427" font-size="11" fill="#1e293b">RNF-04: Disponibilidad 99,5 % (Auto-restart)</text>
<rect x="1020" y="220" width="330" height="380" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<rect x="1020" y="220" width="330" height="28" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1185" y="239" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle"><<databaseServer>> Nodo 4: Servidor Datos</text>
<text x="1030" y="266" font-size="11" fill="#1e293b">Motor: MySQL 8.0 Relacional</text>
<text x="1030" y="283" font-size="11" fill="#1e293b">Red: Subred Privada Backend (Aislada)</text>
<text x="1030" y="300" font-size="11" fill="#1e293b">Puerto: TCP 3306 (Solo acepta Nodo 3)</text>
<text x="1030" y="317" font-size="11" fill="#1e293b">Artefactos alojados:</text>
<text x="1030" y="334" font-size="11" fill="#1e293b">  • esquema_asistencia_qr.sql</text>
<text x="1030" y="351" font-size="11" fill="#1e293b">    (11 tablas en 3FN, PK/FK/CHECK)</text>
<text x="1030" y="368" font-size="11" fill="#1e293b">  • Indices: uk_sesion_aprendiz</text>
<text x="1030" y="385" font-size="11" fill="#1e293b">  • backup-diario-cifrado.sh (AES-256)</text>
<text x="1030" y="402" font-size="11" fill="#1e293b">RNF-02: Base sin exposición a internet/WiFi</text>
<text x="1030" y="419" font-size="11" fill="#1e293b">RNF-04: Backup diario RPO<=24h, RTO<=2h</text>
