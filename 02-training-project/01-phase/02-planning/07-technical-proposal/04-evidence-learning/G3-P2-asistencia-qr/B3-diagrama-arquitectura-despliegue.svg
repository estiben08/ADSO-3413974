<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" width="1440" height="880" font-family="Segoe UI, Arial, sans-serif">
<rect width="1440" height="880" fill="#ffffff"/>
<rect x="20" y="15" width="1400" height="42" rx="6" fill="#1e3a8a"/>
<text x="720" y="42" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">Diagrama Integrado de Arquitectura, Componentes y Despliegue con Trazabilidad Presupuestal (Variante B · 2 Sedes)</text>
<line x1="400" y1="250" x2="510" y2="250" stroke="#1e3a8a" stroke-width="2.5"/>
<text x="455" y="240" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">HTTPS · TCP 443 (TLS 1.3)</text>
<line x1="400" y1="620" x2="510" y2="520" stroke="#1e3a8a" stroke-width="2.5"/>
<text x="455" y="560" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">HTTPS · TCP 443 (TLS 1.3 · 30 conc.)</text>
<line x1="940" y1="440" x2="1040" y2="440" stroke="#1e3a8a" stroke-width="2.5"/>
<text x="990" y="430" font-size="11" font-weight="bold" fill="#0369a1" text-anchor="middle">MySQL · TCP 3306 (Pool 20)</text>
<rect x="40" y="90" width="360" height="330" rx="8" fill="#f8fafc" stroke="#1d4ed8" stroke-width="2"/>
<rect x="40" y="90" width="360" height="32" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="220" y="111" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">NODO 1: PC AULA INSTRUCTOR (2 Sedes · LAN/WiFi)</text>
<text x="52" y="142" font-size="11.2" fill="#1e293b">• Hardware existente del Centro (Excluido con justificación)</text>
<text x="52" y="164" font-size="11.2" fill="#1e293b">• Conectado a Subred Local Aula (192.168.10.0/24 y 192.168.20.0/24)</text>
<text x="52" y="186" font-size="11.2" fill="#1e293b">• Componente Cliente: InterfazWebMVC (Vista Proyección QR)</text>
<text x="52" y="208" font-size="11.2" fill="#1e293b">  - Rotación AJAX del código QR cada 30 s (CU-03, CU-04)</text>
<text x="52" y="230" font-size="11.2" fill="#1e293b">  - Monitoreo en vivo cada 10 s y contingencia (CU-07, CU-08)</text>
<text x="52" y="252" font-size="11.2" fill="#1e293b">  - Descarga de reportes CSV y Excel (CU-09)</text>
<text x="52" y="274" font-size="11.2" fill="#1e293b">• Rubro Presupuesto: Cap. 1 (TH-07) + Cap. 5 (Capacitación EC-09)</text>
<rect x="40" y="470" width="360" height="350" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<rect x="40" y="470" width="360" height="32" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="220" y="491" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">NODO 2: RED WIFI 6 AULA + SMARTPHONES APRENDICES</text>
<text x="52" y="522" font-size="11.2" fill="#1e293b">• Equipos: 4 Puntos de Acceso WiFi 6 Dual-Band PoE (FT-HW-02)</text>
<text x="52" y="544" font-size="11.2" fill="#1e293b">  (2 APs Sede 1 + 2 APs Sede 2) + 2 Switches PoE Gigabit</text>
<text x="52" y="566" font-size="11.2" fill="#1e293b">• Usuarios: 120 usuarios totales / 30 concurrentes pico (Variante B)</text>
<text x="52" y="588" font-size="11.2" fill="#1e293b">• Dispositivos Aprendices: BYOD (Excluidos de compra)</text>
<text x="52" y="610" font-size="11.2" fill="#1e293b">• Componente Cliente: Vista Móvil Escaneo QR (Mobile-First >=360px)</text>
<text x="52" y="632" font-size="11.2" fill="#1e293b">• Validación Zero-Trust: Asigna IP de subred VLAN del ambiente</text>
<text x="52" y="654" font-size="11.2" fill="#1e293b">• Rubros Presupuesto: Cap. 3 (HW-01: 4 APs WiFi 6 + HW-02: Switches)</text>
<rect x="510" y="90" width="430" height="730" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<rect x="510" y="90" width="430" height="32" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="725" y="111" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">NODO 3: SERVIDOR DE APLICACIÓN VPS CLOUD (FT-HW-01 · 2 vCPU, 4 GB RAM)</text>
<text x="522" y="142" font-size="11.2" fill="#1e293b">• SO: Ubuntu Server 24.04 LTS (FT-SW-02 · Licencia GPLv2 $0)</text>
<text x="522" y="164" font-size="11.2" fill="#1e293b">• Proxy Inverso: Nginx 1.26 (Terminación HTTPS TLS 1.3 · Puerto 443)</text>
<text x="522" y="186" font-size="11.2" fill="#1e293b">• Servidor WSGI: Gunicorn 22.0 (4 workers concurrentes · Puerto 8000)</text>
<text x="522" y="208" font-size="11.2" fill="#1e293b">─────────────────────────────────────────────────────────</text>
<text x="522" y="230" font-size="11.2" fill="#1e293b">COMPONENTES DE SOFTWARE PROPIO (FT-SW-01 · Capas 1, 2 y 3):</text>
<text x="522" y="252" font-size="11.2" fill="#1e293b">1. [InterfazWebMVC] -> Controladores HTTP/REST + Plantillas</text>
<text x="522" y="274" font-size="11.2" fill="#1e293b">2. [ComponenteAutenticacionSeguridad] -> Login bcrypt + RBAC + Ley 1581</text>
<text x="522" y="296" font-size="11.2" fill="#1e293b">3. [ComponenteGestionAcademica] -> Fichas, Ambientes, Matrículas N:M</text>
<text x="522" y="318" font-size="11.2" fill="#1e293b">4. [ComponenteSesionQR] -> Apertura Sesión + Token QR HMAC-SHA256</text>
<text x="522" y="340" font-size="11.2" fill="#1e293b">5. [ComponenteValidacionAsistencia] -> Patrón Estrategia:</text>
<text x="522" y="362" font-size="11.2" fill="#1e293b">   • ValidadorFirmaHMAC   • ValidadorSubredIP   • ValidadorUnicidad</text>
<text x="522" y="384" font-size="11.2" fill="#1e293b">6. [ComponenteReportesAlertas] -> Patrón Fábrica CSV/Excel + Alertas >=3</text>
<text x="522" y="406" font-size="11.2" fill="#1e293b">7. [ComponentePersistenciaSQL] -> Pool 20 conexiones (PyMySQL MIT)</text>
<text x="522" y="428" font-size="11.2" fill="#1e293b">─────────────────────────────────────────────────────────</text>
<text x="522" y="450" font-size="11.2" fill="#1e293b">• Rubros Presupuesto: Cap. 1 (TH-01 a TH-10), Cap. 2 (SW-01, SW-02),</text>
<text x="522" y="472" font-size="11.2" fill="#1e293b">  Cap. 4 (CL-01 VPS Cloud) y Cap. 5 (SP-01 Soporte Técnico)</text>
<rect x="1040" y="140" width="360" height="630" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<rect x="1040" y="140" width="360" height="32" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="1220" y="161" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">NODO 4: SERVIDOR DE DATOS Y RESPALDO (Red Privada)</text>
<text x="1052" y="192" font-size="11.2" fill="#1e293b">• Motor: MySQL 8.0 Community Edition (FT-SW-02 · GPLv2 $0)</text>
<text x="1052" y="214" font-size="11.2" fill="#1e293b">• Almacenamiento: Volumen SSD NVMe 80 GB (FT-HW-01)</text>
<text x="1052" y="236" font-size="11.2" fill="#1e293b">• Puerto: TCP 3306 (Aislado en interfaz privada, sin acceso externo)</text>
<text x="1052" y="258" font-size="11.2" fill="#1e293b">─────────────────────────────────────────────────────────</text>
<text x="1052" y="280" font-size="11.2" fill="#1e293b">ARTEFACTOS DE DATOS ALOJADOS:</text>
<text x="1052" y="302" font-size="11.2" fill="#1e293b">• Esquema 3FN de 11 Tablas (B5-script-creacion.sql):</text>
<text x="1052" y="324" font-size="11.2" fill="#1e293b">  centro_formacion, usuario, telefono_usuario, ambiente_formacion,</text>
<text x="1052" y="346" font-size="11.2" fill="#1e293b">  ficha_formacion, matricula_ficha, sesion_asistencia,</text>
<text x="1052" y="368" font-size="11.2" fill="#1e293b">  token_qr_sesion, registro_asistencia, alerta_inasistencia,</text>
<text x="1052" y="390" font-size="11.2" fill="#1e293b">  auditoria_seguridad</text>
<text x="1052" y="412" font-size="11.2" fill="#1e293b">• Índices compuestos: uk_registro_sesion_aprendiz</text>
<text x="1052" y="434" font-size="11.2" fill="#1e293b">• Agente Backup Automatizado (AES-256):</text>
<text x="1052" y="456" font-size="11.2" fill="#1e293b">  - v1.0: Diario 23:30 (RPO <= 24 h, RTO <= 2 h)</text>
<text x="1052" y="478" font-size="11.2" fill="#1e293b">  - v1.1: Cada 12 h 12:30 y 23:30 (RPO <= 12 h, RTO <= 2 h)</text>
<text x="1052" y="500" font-size="11.2" fill="#1e293b">  - Réplica Off-Site S3/Spaces cifrada</text>
<text x="1052" y="522" font-size="11.2" fill="#1e293b">─────────────────────────────────────────────────────────</text>
<text x="1052" y="544" font-size="11.2" fill="#1e293b">• Rubros Presupuesto: Cap. 1 (TH-03) + Cap. 4 (CL-01 y CL-02 Backup)</text>
</svg>