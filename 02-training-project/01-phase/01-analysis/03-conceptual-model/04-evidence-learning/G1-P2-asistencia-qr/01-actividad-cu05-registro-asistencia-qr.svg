<line x1="650" y1="734" x2="430" y2="702" stroke="#334155" stroke-width="1.8"/>
<line x1="500" y1="606" x2="430" y2="690" stroke="#334155" stroke-width="1.8"/>
<line x1="250" y1="724" x2="250" y2="749" stroke="#334155" stroke-width="1.8"/>
<line x1="880" y1="466" x2="430" y2="466" stroke="#334155" stroke-width="1.8"/>
<line x1="880" y1="316" x2="430" y2="455" stroke="#334155" stroke-width="1.8"/>
