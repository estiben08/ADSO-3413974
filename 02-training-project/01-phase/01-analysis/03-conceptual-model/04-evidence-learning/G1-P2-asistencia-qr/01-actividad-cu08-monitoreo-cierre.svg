<line x1="430" y1="166" x2="650" y2="166" stroke="#334155" stroke-width="1.8"/>
<line x1="650" y1="180" x2="250" y2="221" stroke="#334155" stroke-width="1.8"/>
<line x1="250" y1="289" x2="250" y2="325" stroke="#334155" stroke-width="1.8"/>
<text x="250" y="301" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">[sí: contingencia - Alterno 3a]</text>
<line x1="100" y1="255" x2="100" y2="405" stroke="#334155" stroke-width="1.8"/>
<text x="100" y="324" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">[no: todos escanearon]</text>
<line x1="250" y1="369" x2="250" y2="405" stroke="#334155" stroke-width="1.8"/>
<line x1="430" y1="427" x2="665" y2="427" stroke="#334155" stroke-width="1.8"/>
<line x1="740" y1="445" x2="645" y2="505" stroke="#334155" stroke-width="1.8"/>
<text x="692" y="469" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">[ya expiró ventana - Alterno 5a]</text>
<line x1="900" y1="445" x2="995" y2="505" stroke="#334155" stroke-width="1.8"/>
<text x="947" y="469" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">[sesión abierta]</text>
<line x1="645" y1="547" x2="780" y2="580" stroke="#334155" stroke-width="1.8"/>
<line x1="995" y1="547" x2="880" y2="580" stroke="#334155" stroke-width="1.8"/>
<line x1="830" y1="624" x2="830" y2="631" stroke="#334155" stroke-width="1.8"/>
<line x1="910" y1="685" x2="1000" y2="725" stroke="#334155" stroke-width="1.8"/>
<text x="955" y="699" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">[>= 3 fallas]</text>
<line x1="670" y1="665" x2="430" y2="702" stroke="#334155" stroke-width="1.8"/>
<text x="550" y="677" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">[< 3 fallas]</text>
