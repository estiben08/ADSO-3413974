<text x="820" y="424" font-size="11.5" font-weight="bold" fill="#78350f" text-anchor="middle">¿Red del aula identificable?</text>
<rect x="70" y="420" width="360" height="44" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="250" y="447" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">4b.1 Recibir aviso de red no institucional</text>
<rect x="640" y="490" width="360" height="8" fill="#0f172a"/>
<text x="1010" y="498" font-size="10.5" font-weight="bold" fill="#334155">Fork (Concurrencia)</text>
<rect x="510" y="525" width="290" height="46" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="655" y="553" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">4.1 Registrar sesión Activa con subred</text>
<rect x="830" y="525" width="320" height="46" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="990" y="553" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">4.2 Generar primer QR firmado (CU-04)</text>
<rect x="640" y="595" width="360" height="8" fill="#0f172a"/>
<text x="1010" y="603" font-size="10.5" font-weight="bold" fill="#334155">Join (Sincronización)</text>
<rect x="640" y="630" width="360" height="44" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="820" y="657" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">5. Activar temporizador rotación 30 s</text>
<rect x="70" y="630" width="360" height="44" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="250" y="657" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">6. Proyectar código QR dinámico en aula</text>
