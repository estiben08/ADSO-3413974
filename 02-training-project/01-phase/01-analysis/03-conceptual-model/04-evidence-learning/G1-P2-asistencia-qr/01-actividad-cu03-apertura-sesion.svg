<rect x="70" y="155" width="360" height="44" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="250" y="182" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">1. Solicitar apertura de sesión de asistencia</text>
