<text x="250" y="347" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">3a.1 Reabrir vista de sesión activa existente</text>
<rect x="860" y="320" width="300" height="44" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
<text x="1010" y="347" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">3b.1 Informar jornada ya cerrada hoy</text>
